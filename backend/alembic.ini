# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
file_template = %%year%%%%month%%day%%_%%hour%%minute%%_%%rev%%_%%slug%%

# target database is the database that Alembic will modify
target_metadata = None

# file to write the database version
version_locations = %(here)s/alembic/versions

version_file_separator = :

# output encoding for migration files
output_encoding = utf-8

# sqlalchemy.url - A url to the database.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost/agent_cluster

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly generated revision scripts.
# See the documentation for more detail: https://alembic.sqlalchemy.org/en/latest/autogenerate.html#post-write-hooks

# loggers
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
